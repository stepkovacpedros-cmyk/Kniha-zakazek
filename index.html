<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Štěpkovač</title>
<meta name="theme-color" content="#2F6B3A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Štěpkovač">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --g:#2F6B3A; --g2:#1F4A27; --gl:#E6F0E4;
  --bg:#F4F5F1; --card:#fff; --line:#E3E6DF; --chip:#EEF0EC;
  --tx:#1B1F1A; --mut:#5A6157;
  --am:#D98A0B; --ambg:#FFF8EC; --amln:#F0DFC0; --amtx:#6B5326;
  --red:#C2362F;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;font-size:16px;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
#app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
#view{flex:1;padding:calc(18px + var(--sat)) 18px calc(150px + var(--sab))}
h1{margin:0;font-size:26px;font-weight:700;letter-spacing:-.02em}
h2{margin:0;font-size:16px;font-weight:600}
.sub{font-size:13px;color:var(--mut);font-weight:500}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.icon-btn{width:44px;height:44px;border-radius:12px;border:1px solid #D6D9D2;background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.icon-btn svg{width:20px;height:20px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:14px 0 18px}
.tile{background:#fff;border-radius:12px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.tile b{font-size:18px}
.tile span{font-size:11px;color:var(--mut)}
.label{font-size:12px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin:4px 0 8px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;width:100%;text-align:left}
.list{display:flex;flex-direction:column;gap:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;background:var(--chip);color:#3A4037;padding:4px 8px;border-radius:999px}
.chip.g{background:var(--gl);color:var(--g2);font-weight:600}
.card.fuel{background:var(--ambg);border-color:var(--amln);flex-direction:row;align-items:center;gap:12px}
.fuel-ic{width:40px;height:40px;border-radius:10px;background:#F6E3BF;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.fuel-ic svg{width:20px;height:20px}
.empty{color:var(--mut);text-align:center;padding:28px 10px;font-size:15px;background:#fff;border-radius:14px;border:1px dashed #D6D9D2}
.actions{position:fixed;left:0;right:0;bottom:calc(64px + var(--sab));padding:10px 18px;display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:560px;margin:0 auto;background:linear-gradient(rgba(244,245,241,0),var(--bg) 30%)}
.btn{height:52px;border-radius:14px;border:none;background:var(--g);color:#fff;font-size:16px;font-weight:600;padding:0 16px}
.btn.o{background:#fff;color:var(--g);border:1px solid var(--g)}
.btn.red{background:#fff;color:var(--red);border:1px solid #E7B9B5}
.btn.full{width:100%}
.btn:disabled{opacity:.5}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:6px 0 calc(6px + var(--sab));z-index:5}
nav.tabs button{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--mut);min-height:48px;justify-content:center}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--g);font-weight:600}
/* Dny */
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:#3A4037}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;background:var(--g);vertical-align:-1px;margin-right:5px}
.legend i.f{border-radius:999px;background:#C27A08}
.axis{display:flex;justify-content:space-between;font-size:11px;color:var(--mut);padding:0 2px;margin:12px 0 6px;font-variant-numeric:tabular-nums}
.day{display:flex;flex-direction:column;gap:8px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 12px 14px;width:100%;text-align:left}
.day.today{border-color:var(--g);box-shadow:0 0 0 1px var(--g) inset;background:#F3FAF0}
.day.past{background:#FFF7F6;border-color:#F1DCD9}
body{transition:background-color .2s}
.sugg{position:relative}
.sugg-list{position:absolute;left:0;right:0;top:calc(100% + 4px);background:#fff;border:1px solid #C9CDD3;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.12);z-index:30;overflow:hidden}
.sugg-list button{display:block;width:100%;text-align:left;background:none;border:none;border-top:1px solid #EEF0EC;padding:10px 14px;min-height:48px}
.sugg-list button:first-child{border-top:none}
.sugg-list b{display:block;font-size:15px;font-weight:600}
.sugg-list small{display:block;font-size:12px;color:var(--mut);margin-top:2px}
.sugg-list .src{font-size:11px;color:var(--mut);padding:6px 14px;text-align:right;border-top:1px solid #EEF0EC}
.bar{position:relative;height:30px;border-radius:8px;background:var(--chip);overflow:hidden}
.bar .grid{position:absolute;inset:0;display:flex}
.bar .grid span{flex:1;border-right:1px solid #E0E3DC}
.bar .grid span:last-child{border-right:none}
.blk{position:absolute;top:3px;bottom:3px;background:var(--g);color:#fff;border-radius:6px;font-size:11px;font-weight:600;display:flex;align-items:center;padding:0 6px;white-space:nowrap;overflow:hidden;min-width:4px}
.dot{position:absolute;top:8px;width:14px;height:14px;margin-left:-7px;border-radius:999px;background:#C27A08;border:2px solid #fff}
.dot.s{background:#8E4A12}
.dot.p{background:#2F6FB0}
.legend i.p{border-radius:999px;background:#2F6FB0}
.card.fuel.p{background:#EEF4FB;border-color:#CFE0F2}
.card.fuel.p .fuel-ic{background:#D9E7F6}
.seg button small{display:block;font-size:11px;font-weight:500;color:var(--mut);margin-top:1px}
.legend i.s{border-radius:999px;background:#8E4A12}
.card.fuel.s{background:#F6EFE8;border-color:#E6D5C3}
.card.fuel.s .fuel-ic{background:#EADBCB}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;background:#F5F6F8;border-radius:12px;padding:4px}
.seg button{height:52px;line-height:1.15;border-radius:9px;border:none;background:transparent;font-size:16px;font-weight:500;color:#4A5059}
.seg button.on{background:#fff;color:var(--tx);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.sheet{will-change:transform}
.bar .none{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--mut)}
.sumbar{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:14px}
/* Swipe animace */
@keyframes inL{from{transform:translateX(40px);opacity:.3}to{transform:none;opacity:1}}
@keyframes inR{from{transform:translateX(-40px);opacity:.3}to{transform:none;opacity:1}}
#view.inL{animation:inL .22s ease-out}
#view.inR{animation:inR .22s ease-out}
#view{touch-action:pan-y}
/* Přehled */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:14px 0}
.kpi{background:#fff;border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.kpi span{font-size:12px;color:var(--mut)}
.kpi b{font-size:28px;font-weight:700;letter-spacing:-.02em}
.kpi.hl{background:var(--g);color:#fff}
.kpi.hl span{color:#D5E6D2}
.box{background:#fff;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.tr{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:10px;padding:10px 0;border-top:1px solid #EEECE6;align-items:center;background:none;border-left:none;border-right:none;border-bottom:none;text-align:left;width:100%}
.tr small{display:block;font-size:12px;color:var(--mut);margin-top:2px}
/* Formuláře */
.overlay{position:fixed;inset:0;background:rgba(20,24,20,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:560px;max-height:92vh;border-radius:20px 20px 0 0;display:flex;flex-direction:column}
.sheet-h{padding:16px 18px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.sheet-b{padding:16px 18px;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:14px}
.sheet-f{padding:12px 18px calc(14px + var(--sab));border-top:1px solid var(--line);display:flex;gap:10px}
.sheet-f .btn{flex:1}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f label,.f .lb{font-size:13px;font-weight:600;color:#4A5059}
.in{height:48px;border:1px solid #C9CDD3;border-radius:12px;padding:0 12px;font-size:16px;background:#fff;width:100%;min-width:0;-webkit-appearance:none;appearance:none}
textarea.in{height:76px;padding:10px 12px;resize:vertical}
.in:focus{outline:2px solid var(--g);outline-offset:0;border-color:var(--g)}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.inrow{display:flex;gap:8px}
.inrow .in{flex:1}
.calc{background:#F5F6F8;border-radius:12px;padding:10px 14px;font-size:14px;color:#4A5059;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.calc strong{color:var(--tx)}
.in.auto{background:#F0F7EE;border-color:#B9D6B2}
.status{font-size:13px;color:var(--mut);min-height:18px}
.status.err{color:var(--red)}
.status.ok{color:var(--g2)}
.quick{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.quick button{height:44px;border-radius:10px;border:1px solid #C9CDD3;background:#fff;font-size:15px}
.quick button.on{border:2px solid var(--g);background:var(--gl);color:var(--g2);font-weight:700}
.stepper{display:flex;align-items:center;justify-content:space-between;background:#F5F6F8;border-radius:12px;padding:8px}
.stepper button{width:52px;height:52px;border-radius:12px;border:none;background:#fff;font-size:26px;font-weight:600}
.stepper button.plus{background:var(--g);color:#fff}
.stepper .v{display:flex;flex-direction:column;align-items:center}
.stepper .v b{font-size:28px}
.stepper .v span{font-size:13px;color:var(--mut)}
.toast{position:fixed;left:50%;top:calc(14px + var(--sat));transform:translateX(-50%);background:#1B1F1A;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.setting{background:#fff;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;margin-top:14px}
.note{font-size:13px;color:var(--mut);line-height:1.45}
.hidden{display:none!important}
.chart{background:#fff;border-radius:16px;padding:14px 14px 10px;margin-bottom:12px;position:relative}
.chart h2{font-size:15px}
.chart .csub{font-size:12px;color:var(--mut);margin:2px 0 8px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .lg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:#3A4037;margin:0 0 6px}
.chart .lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.chart .empty2{font-size:13px;color:var(--mut);padding:18px 0;text-align:center}
.tipbox{position:absolute;top:44px;transform:translateX(-50%);background:#1B1F1A;color:#fff;font-size:12px;line-height:1.4;padding:8px 10px;border-radius:10px;pointer-events:none;white-space:nowrap;z-index:5;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.chart details{margin-top:6px;font-size:13px}
.chart summary{color:var(--mut);cursor:pointer;padding:4px 0;min-height:32px;display:flex;align-items:center}
.chart table{width:100%;border-collapse:collapse;font-size:12px;margin-top:4px;font-variant-numeric:tabular-nums}
.chart td,.chart th{padding:5px 4px;border-top:1px solid #EEF0EC;text-align:right}
.chart td:first-child,.chart th:first-child{text-align:left}
.chart th{color:var(--mut);font-weight:600}
.kpi small{font-size:12px;color:var(--mut)}
.kpi b.m{font-size:22px}
</style>
</head>
<body>
<div id="app">
  <main id="view"></main>
  <div class="actions" id="actions">
    <button class="btn" data-act="new-job">+ Zakázka</button>
    <button class="btn o" data-act="new-fuel">+ Tankování</button>
  </div>
  <nav class="tabs" aria-label="Hlavní menu">
    <button data-tab="denik"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16v16H4z"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>Deník</button>
    <button data-tab="dny"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/><path d="M7 4v4M13 10v4M10 16v4"/></svg>Dny</button>
    <button data-tab="prehled"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Přehled</button>
    <button data-tab="stat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 6-7"/></svg>Statistiky</button>
    <button data-tab="nastaveni"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Nastavení</button>
  </nav>
</div>
<div id="sheet-root"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="import-file" accept="application/json,.json" class="hidden">

<script>
'use strict';
/* ===== Úložiště ===== */
const KEY = 'stepkovac.v1';
const DEFAULT_SETTINGS = { startAddress: 'Na Horce 278, Doubravice nad Svitavou', startLat: null, startLon: null, loadM3: 15 };
function loadData() {
  try {
    const d = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (d && Array.isArray(d.jobs) && Array.isArray(d.fuel)) {
      d.settings = Object.assign({}, DEFAULT_SETTINGS, d.settings || {});
      return d;
    }
  } catch (e) {}
  return { jobs: [], fuel: [], settings: Object.assign({}, DEFAULT_SETTINGS) };
}
let DB = loadData();
function saveData() {
  try { localStorage.setItem(KEY, JSON.stringify(DB)); }
  catch (e) { toast('Uložení selhalo – plné úložiště?'); }
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

/* ===== Pomocné funkce ===== */
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = (n) => String(n).padStart(2, '0');
const iso = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parseIso = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parseIso(s); d.setDate(d.getDate() + n); return iso(d); };
const todayIso = () => iso(new Date());
const weekStart = (s) => { const d = parseIso(s); const wd = (d.getDay() + 6) % 7; d.setDate(d.getDate() - wd); return iso(d); };
const DAYS = ['Ne', 'Po', 'Út', 'St', 'Čt', 'Pá', 'So'];
const MONTHS = ['leden', 'únor', 'březen', 'duben', 'květen', 'červen', 'červenec', 'srpen', 'září', 'říjen', 'listopad', 'prosinec'];
const MONTHS_GEN = ['ledna', 'února', 'března', 'dubna', 'května', 'června', 'července', 'srpna', 'září', 'října', 'listopadu', 'prosince'];
const DAYS_LONG = ['Neděle', 'Pondělí', 'Úterý', 'Středa', 'Čtvrtek', 'Pátek', 'Sobota'];
const longDate = (s) => { const d = parseIso(s); return DAYS_LONG[d.getDay()] + ' ' + d.getDate() + '. ' + MONTHS_GEN[d.getMonth()] + (d.getFullYear() !== new Date().getFullYear() ? ' ' + d.getFullYear() : ''); };
const shortDate = (s) => { const d = parseIso(s); return d.getDate() + '. ' + (d.getMonth() + 1) + '.'; };
const num = (x, dec = 1) => (Math.round((+x || 0) * 10 ** dec) / 10 ** dec).toLocaleString('cs-CZ', { maximumFractionDigits: dec });
const money = (x) => Math.round(+x || 0).toLocaleString('cs-CZ') + ' Kč';
const toMin = (t) => { if (!t) return null; const [h, m] = t.split(':').map(Number); return h * 60 + m; };
function jobMinutes(j) {
  const a = toMin(j.from), b = toMin(j.to);
  if (a == null || b == null) return 0;
  return b >= a ? b - a : b + 1440 - a;
}
function fmtDur(min) {
  min = Math.round(min);
  const h = Math.floor(min / 60), m = min % 60;
  if (!h) return m + ' min';
  return m ? h + ' h ' + m + ' min' : h + ' h';
}
function fmtLoads(x) {
  x = +x || 0;
  const w = Math.floor(x + 1e-9), f = Math.round((x - w) * 100) / 100;
  const fr = { 0: '', 0.25: '¼', 0.5: '½', 0.75: '¾' }[f];
  if (fr === undefined) return num(x, 2);
  if (!w && fr) return fr;
  return w + fr;
}
const loadsWord = (x) => (x > 0 && x <= 1 ? 'fůra' : x > 1 && x < 5 ? 'fůry' : 'fůr');
const m3 = (loads) => (+loads || 0) * (+DB.settings.loadM3 || 15);
// každá započatá fůra = jedna cesta tam a zpět (vysypání na základně)
const trips = (loads) => Math.max(1, Math.ceil((+loads || 0) - 1e-9));
const kmRound = (j) => (j.kmOneWay != null && j.kmOneWay !== '' ? (+j.kmOneWay) * 2 * trips(j.loads) : 0);
const VEH = { auto: 'Auto', stepkovac: 'Štěpkovač', pila: 'Pila' };
const FUELT = { auto: 'nafta', stepkovac: 'nafta', pila: 'benzín' };
const VCOL = { auto: '#C27A08', stepkovac: '#8E4A12', pila: '#2F6FB0' };
const VCLS = { auto: '', stepkovac: ' s', pila: ' p' };
const veh = (f) => (VEH[f.vehicle] ? f.vehicle : 'auto');
const ODO = { auto: { lb: 'Stav km (tachometr)', u: 'km', per: 'l/100 km' }, stepkovac: { lb: 'Motohodiny', u: 'mth', per: 'l/mth' }, pila: null };
const fkey = (f) => f.date + ' ' + (f.time || '00:00') + ' ' + (f.created || 0);
// předchozí tankování stejného stroje se stavem tachometru
function prevOdo(f, vehicle, odoRef) {
  const v = vehicle || veh(f), k = fkey(f);

    .sort((a, b) => fkey(b).localeCompare(fkey(a)))[0] || null;

// spotřeba metodou "plná nádrž": litry tohoto tankování / ujeto od minulého

/* ===== Dny – časová osa ===== */

  days.forEach(d => {

/* ===== Statistiky a grafy ===== */
const MON_SHORT = ['led', 'úno', 'bře', 'dub', 'kvě', 'čvn', 'čvc', 'srp', 'zář', 'říj', 'lis', 'pro'];
const INK = '#5A6157', GRID = '#E9ECE6';
const TIPS = {};
function statBuckets() {
  const t = todayIso(), off = UI.statOff, out = [];
  if (UI.statMode === 'dny') {
    const end = addDays(t, off * 14);
    for (let i = 13; i >= 0; i--) { const d = addDays(end, -i), dt = parseIso(d); out.push({ from: d, to: d, label: dt.getDate() + '.', long: DAYS[dt.getDay()] + ' ' + shortDate(d) }); }
  } else if (UI.statMode === 'tydny') {
    const endW = addDays(weekStart(t), off * 84);
    for (let i = 11; i >= 0; i--) { const w = addDays(endW, -7 * i); out.push({ from: w, to: addDays(w, 6), label: String(isoWeek(w)), long: isoWeek(w) + '. týden (' + shortDate(w) + ' – ' + shortDate(addDays(w, 6)) + ')' }); }
  } else {
    let [y, m] = t.slice(0, 7).split('-').map(Number); m += off * 12;
    while (m < 1) { m += 12; y--; } while (m > 12) { m -= 12; y++; }
    for (let i = 11; i >= 0; i--) {
      let yy = y, mm = m - i; while (mm < 1) { mm += 12; yy--; }
      const last = new Date(yy, mm, 0).getDate();
      out.push({ from: yy + '-' + pad(mm) + '-01', to: yy + '-' + pad(mm) + '-' + pad(last), label: MON_SHORT[mm - 1], long: MONTHS[mm - 1] + ' ' + yy });
    }
  }
  return out;
}
function niceMax(v) { if (!(v > 0)) return 1; const p = 10 ** Math.floor(Math.log10(v)), n = v / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p; }
const fmtTick = (v) => v >= 10000 ? num(v / 1000, 0) + ' tis.' : num(v, v < 10 ? 1 : 0);
const roundTop = (x, y, w, h, r, c) => { r = Math.min(r, h, w / 2); return `<path d="M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z" fill="${c}"/>`; };
const W = 340, H = 170, PL = 42, PR = 10, PT = 8, PB = 22, PW = W - PL - PR, PH = H - PT - PB;
function axisY(max) {
  return [0, max / 2, max].map(t => { const y = PT + PH - t / max * PH; return `<line x1="${PL}" x2="${W - PR}" y1="${y}" y2="${y}" stroke="${GRID}" stroke-width="1"/><text x="${PL - 6}" y="${y + 3.5}" text-anchor="end" font-size="10" fill="${INK}">${fmtTick(t)}</text>`; }).join('');
}
function legend(series) { return series.length < 2 ? '' : `<div class="lg">${series.map(se => `<span><i style="background:${se.color}"></i>${esc(se.name)}</span>`).join('')}</div>`; }
// sloupcový (i skládaný) graf podle období
function barChart(id, B, series, vals, unitTxt, dec) {
  const tot = vals.map(o => series.reduce((a, se) => a + (o[se.key] || 0), 0));
  if (!tot.some(v => v > 0)) return '<div class="empty2">Za toto období nejsou data.</div>';
  const max = niceMax(Math.max(...tot)), slot = PW / B.length, bw = Math.min(24, slot * 0.62), every = Math.ceil(B.length / 7);
  let g = axisY(max);
  B.forEach((b, i) => {
    const cx = PL + slot * i + slot / 2; let y0 = PT + PH;
    const segs = series.filter(se => (vals[i][se.key] || 0) > 0);
    segs.forEach((se, k) => {
      const h = vals[i][se.key] / max * PH, yTop = y0 - h, yBot = k > 0 ? y0 - 2 : y0, hh = Math.max(yBot - yTop, 1);
      g += k === segs.length - 1 ? roundTop(cx - bw / 2, yTop, bw, hh, 4, se.color) : `<rect x="${cx - bw / 2}" y="${yTop}" width="${bw}" height="${hh}" fill="${se.color}"/>`;

/* ===== Mapy.com (s API klíčem) / OpenStreetMap (bez klíče) ===== */
const MAPY = 'https://api.mapy.com/v1';
// Výchozí klíč Mapy.com – v Nastavení ho lze přepsat vlastním
const MAPY_DEFAULT_KEY = 'nY-91216wSSQ5waRO4ABMmtDldTuDGTPzp8kd8WcsQM';
const mapyKey = () => ((DB.settings.mapyKey || '').trim() || MAPY_DEFAULT_KEY);
const mapyQ = () => '&apikey=' + encodeURIComponent(mapyKey());
function mapyLabel(it) {
  const loc = (it.location || '').split(',')[0].trim();
  return loc && loc !== it.name ? it.name + ', ' + loc : it.name;
}
async function mapySuggest(q) {
  let url = `${MAPY}/suggest?lang=cs&limit=6&type=regional.address&type=regional.street&type=regional.municipality&type=regional.municipality_part&type=poi&query=${encodeURIComponent(q)}`;
  const st = DB.settings;
  if (st.startLat != null) url += `&preferNear=${st.startLon},${st.startLat}&preferNearPrecision=10000`;
  const r = await fetch(url + mapyQ());
  if (!r.ok) throw new Error(r.status === 401 || r.status === 403 ? 'key' : 'suggest');
  const j = await r.json();
  return (j.items || []).filter(i => i.position).map(i => ({ label: mapyLabel(i), name: i.name, sub: i.location || '', lat: i.position.lat, lon: i.position.lon }));
}
async function geocode(q) {
  if (mapyKey()) {
    const r = await fetch(`${MAPY}/geocode?lang=cs&limit=1&query=${encodeURIComponent(q)}` + mapyQ());
    if (r.ok) {
      const j = await r.json();
      if (j.items && j.items.length && j.items[0].position) return { lat: j.items[0].position.lat, lon: j.items[0].position.lon };
      throw new Error('notfound');
    }
  }
  const r = await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=cz&accept-language=cs&q=' + encodeURIComponent(q));
  if (!r.ok) throw new Error('geocode');
  const a = await r.json();
  if (!a.length) throw new Error('notfound');
  return { lat: +a[0].lat, lon: +a[0].lon };
}
async function reverseGeocode(lat, lon) {
  if (mapyKey()) {
    try {
      const r = await fetch(`${MAPY}/rgeocode?lang=cs&lon=${lon}&lat=${lat}` + mapyQ());
      if (r.ok) { const j = await r.json(); if (j.items && j.items.length) return mapyLabel(j.items[0]); }
    } catch (e) {}
  }
  const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&accept-language=cs&zoom=17&lat=${lat}&lon=${lon}`);
  if (!r.ok) throw new Error('reverse');
  const a = await r.json(), ad = a.address || {};
  const town = ad.village || ad.town || ad.city || ad.municipality || ad.hamlet || '';
  const street = ad.road ? ad.road + (ad.house_number ? ' ' + ad.house_number : '') : '';
  return [street, town].filter(Boolean).join(', ') || a.display_name || '';
}
// název obce pro danou polohu
async function townAt(lat, lon) {
  if (mapyKey()) {
    try {
      const r = await fetch(`${MAPY}/rgeocode?lang=cs&lon=${lon}&lat=${lat}` + mapyQ());
      if (r.ok) {
        const j = await r.json();
        for (const it of (j.items || [])) {
          if (it.type === 'regional.municipality') return it.name;
          const m = (it.regionalStructure || []).find(x => x.type === 'regional.municipality');
          if (m) return m.name;
        }
      }
    } catch (e) {}
  }
  const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&accept-language=cs&zoom=14&lat=${lat}&lon=${lon}`);
  if (!r.ok) return '';
  const ad = (await r.json()).address || {};
  return ad.village || ad.town || ad.city || ad.municipality || '';
}
async function routeKm(a, b) {
  if (mapyKey()) {
    try {
      const r = await fetch(`${MAPY}/routing/route?lang=cs&routeType=car_fast&start=${a.lon},${a.lat}&end=${b.lon},${b.lat}` + mapyQ());
      if (r.ok) { const j = await r.json(); if (j.length > 0) return j.length / 1000; }
    } catch (e) {}
  }
  const r = await fetch(`https://router.project-osrm.org/route/v1/driving/${a.lon},${a.lat};${b.lon},${b.lat}?overview=false`);
  if (!r.ok) throw new Error('route');
  const j = await r.json();
  if (!j.routes || !j.routes.length) throw new Error('noroute');
  return j.routes[0].distance / 1000;
}
async function getStart() {
  const st = DB.settings;
  if (st.startLat != null && st.startLon != null) return { lat: st.startLat, lon: st.startLon };

/* ===== Zákazníci: historie + ARES (obchodní rejstřík) ===== */
const ARES = 'https://ares.gov.cz/ekonomicke-subjekty-v-be/rest/ekonomicke-subjekty';
const fold = (t) => String(t || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
function aresItem(e) {
  return { name: e.obchodniJmeno || '', ico: e.ico || '', addr: (e.sidlo && e.sidlo.textovaAdresa) || '', src: 'ares' };
}
async function aresSearch(q) {
  if (/^\d{8}$/.test(q.replace(/\s/g, ''))) {
    const r = await fetch(`${ARES}/${q.replace(/\s/g, '')}`, { headers: { Accept: 'application/json' } });
    if (!r.ok) return [];
    return [aresItem(await r.json())];
  }
  const r = await fetch(`${ARES}/vyhledat`, { method: 'POST', headers: { 'Content-Type': 'application/json', Accept: 'application/json' }, body: JSON.stringify({ obchodniJmeno: q, start: 0, pocet: 8 }) });
  if (!r.ok) return [];
  const j = await r.json();
  return (j.ekonomickeSubjekty || []).map(aresItem);
}

function onCustInput() {

/* ===== Benzinky podle polohy ===== */
function distM(a, b) {
  const R = 6371000, toR = Math.PI / 180, dLa = (b.lat - a.lat) * toR, dLo = (b.lon - a.lon) * toR;
  const h = Math.sin(dLa / 2) ** 2 + Math.cos(a.lat * toR) * Math.cos(b.lat * toR) * Math.sin(dLo / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
const fmtDist = (m) => m < 1000 ? Math.round(m / 10) * 10 + ' m' : num(m / 1000) + ' km';
async function stationsOsm(pos) {
  const q = `[out:json][timeout:15];nwr(around:5000,${pos.lat},${pos.lon})[amenity=fuel];out center tags;`;
  const r = await fetch('https://overpass-api.de/api/interpreter?data=' + encodeURIComponent(q));
  if (!r.ok) throw new Error('osm');
  const j = await r.json();
  return (j.elements || []).map(e => {
    const t = e.tags || {}, lat = e.lat ?? (e.center && e.center.lat), lon = e.lon ?? (e.center && e.center.lon);
    const brand = t.brand || t.name || t.operator || 'Čerpací stanice';
    return { brand, name: t.name || '', city: t['addr:city'] || '', street: t['addr:street'] || '', lat, lon };
  }).filter(x => x.lat != null);
}
async function stationsMapy(pos) {
  const r = await fetch(`${MAPY}/geocode?lang=cs&limit=8&type=poi&query=${encodeURIComponent('čerpací stanice')}&preferNear=${pos.lon},${pos.lat}&preferNearPrecision=2000` + mapyQ());
  if (!r.ok) throw new Error('mapy');
  const j = await r.json();
  return (j.items || []).filter(i => i.position).map(i => ({ brand: i.name, name: i.name, city: (i.location || '').split(',')[0].trim(), street: '', lat: i.position.lat, lon: i.position.lon }));
}
function getPos() {
  return new Promise((res, rej) => {
    if (!navigator.geolocation) return rej(new Error('nogeo'));
    navigator.geolocation.getCurrentPosition(p => res({ lat: p.coords.latitude, lon: p.coords.longitude }), () => rej(new Error('nogeo')), { enableHighAccuracy: true, timeout: 12000, maximumAge: 60000 });
  });
}
async function nearFuel(auto) {
  const st = $('#f-st'); if (!st) return;
  st.className = 'status'; st.textContent = 'Hledám benzinky v okolí…';
  try {
    const pos = await getPos();
    if (!FORM || FORM.kind !== 'fuel') return;
    let list = [];
    try { list = await stationsOsm(pos); } catch (e) {}
    if (!list.length && mapyKey()) { try { list = await stationsMapy(pos); } catch (e) {} }
    if (!FORM || FORM.kind !== 'fuel') return;
    list.forEach(x => x.d = distM(pos, x));
    list = list.filter(x => x.d < 10000).sort((a, b) => a.d - b.d).slice(0, 6);
    if (!list.length) { st.className = 'status err'; st.textContent = 'V okolí jsem žádnou benzinku nenašel – napište ji ručně.'; return; }
    // město doplnit podle polohy, pokud ho benzinka nemá v datech
    let town = '';
    if (list.some(x => !x.city)) { try { town = await townAt(pos.lat, pos.lon); } catch (e) {} }
    list.forEach(x => { const c = x.city || town; x.label = c && !x.brand.includes(c) ? x.brand + ' ' + c : x.brand; });
    FORM.stations = list;
    if (list[0].d < 400) {
      $('#f-place').value = list[0].label;
      st.className = 'status ok'; st.textContent = `Jste u: ${list[0].label} (${fmtDist(list[0].d)}). Jiná? Klepněte na špendlík.`;
      if (auto) return;
    } else {
      st.className = 'status'; st.textContent = 'Vyberte benzinku:';
    }
    const l = $('#f-sugg');
    l.innerHTML = list.map((x, i) => `<button type="button" data-act="pick-station" data-i="${i}"><b>${esc(x.label)}</b><small>${fmtDist(x.d)}${x.street ? ' · ' + esc(x.street) : ''}</small></button>`).join('') + '<div class="src">Data © OpenStreetMap / Mapy.com</div>';
    l.classList.remove('hidden');
  } catch (e) {
    st.className = 'status' + (auto ? '' : ' err');
    st.textContent = auto ? '' : 'Polohu se nepodařilo zjistit (povolte ji v nastavení Safari).';
  }
}
const pnum = (id) => { const v = parseFloat(($('#' + id).value || '').replace(/\s/g, '').replace(',', '.')); return v > 0 ? v : 0; };
const setNum = (id, v) => { const el = $('#' + id); el.value = v > 0 ? String(Math.round(v * 100) / 100).replace('.', ',') : ''; };
// dopočítá to pole, které uživatel upravoval nejdéle zpátky
function updOdo() {

  const dist = odo - p.odo, c = l ? (v === 'auto' ? l / dist * 100 : l / dist) : 0;

function updFuelCalc(changedId) {
  const ids = ['f-l', 'f-ppl', 'f-p'];
  if (changedId && ids.includes(changedId)) {
    FORM.edits = [changedId, ...FORM.edits.filter(x => x !== changedId)].slice(0, 2);
  }
  ids.forEach(id => $('#' + id).classList.remove('auto'));
  if (FORM.edits.length < 2) return;
  const target = ids.find(id => !FORM.edits.includes(id));
  const l = pnum('f-l'), c = pnum('f-ppl'), p = pnum('f-p');
  if (target === 'f-p' && l && c) setNum('f-p', l * c);
  else if (target === 'f-ppl' && l && p) setNum('f-ppl', p / l);
  else if (target === 'f-l' && c && p) setNum('f-l', p / c);
  else return;
  $('#' + target).classList.add('auto');
}

function download(name, text, type) {
  const blob = new Blob([text], { type }), url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click();

}
const csvCell = (v) => { const s = String(v ?? ''); return /[;"\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
const csvDate = (s) => { const d = parseIso(s); return d.getDate() + '.' + (d.getMonth() + 1) + '.' + d.getFullYear(); };
const dec = (x, d = 2) => (Math.round((+x || 0) * 10 ** d) / 10 ** d).toString().replace('.', ',');
function csvJobs() {
  const ym = UI.month, rows = DB.jobs.filter(j => j.date.startsWith(ym)).sort((a, b) => (a.date + a.from).localeCompare(b.date + b.from));

  download(`zakazky-${ym}.csv`, '﻿' + out.map(r => r.map(csvCell).join(';')).join('\r\n'), 'text/csv;charset=utf-8');

function csvFuel() {
  const ym = UI.month, rows = DB.fuel.filter(f => f.date.startsWith(ym)).sort((a, b) => (a.date + (a.time || '')).localeCompare(b.date + (b.time || '')));
  const out = [['Datum', 'Čas', 'Stroj', 'Palivo', 'Místo', 'Litry', 'Kč celkem', 'Kč/l', 'Stav km / mth', 'Ujeto od minula', 'Spotřeba', 'Jednotka', 'Poznámka']];
  rows.forEach(f => { const c = consumption(f); out.push([csvDate(f.date), f.time, VEH[veh(f)], FUELT[veh(f)], f.place, dec(f.liters), dec(f.price), f.liters ? dec(f.price / f.liters) : '', +f.odo > 0 ? dec(f.odo, 1) : '', c ? dec(c.dist, 1) : '', c ? dec(c.val, 2) : '', c ? c.per : '', f.note]); });
  download(`tankovani-${ym}.csv`, '﻿' + out.map(r => r.map(csvCell).join(';')).join('\r\n'), 'text/csv;charset=utf-8');
}

/* ===== Události ===== */
document.addEventListener('click', (e) => {
  const tab = e.target.closest('[data-tab]');
  if (tab) { go(tab.dataset.tab); return; }
  const el = e.target.closest('[data-act]');
  if (!(el && el.dataset.act === 'tip')) document.querySelectorAll('.tipbox').forEach(t => t.remove());
  if (FORM && FORM.kind === 'job' && !(el && el.dataset.act === 'pick-sugg') && e.target.id !== 'j-place') hideSugg();
  if (FORM && FORM.kind === 'job' && !(el && el.dataset.act === 'pick-cust') && e.target.id !== 'j-cust') hideCust();
  if (FORM && FORM.kind === 'fuel' && !(el && (el.dataset.act === 'pick-station' || el.dataset.act === 'near-fuel'))) { const l = $('#f-sugg'); if (l) { l.innerHTML = ''; l.classList.add('hidden'); } }
  if (!el) return;
  const act = el.dataset.act;
  if (act === 'overlay' && e.target !== el) return;
  switch (act) {
    case 'new-job': openJob(); break;
    case 'new-fuel': openFuel(); break;
    case 'edit-job': openJob(el.dataset.id); break;
    case 'edit-fuel': openFuel(el.dataset.id); break;
    case 'overlay': case 'close': closeSheet(); break;
    case 'day': shift(+el.dataset.n); break;
    case 'today': UI.day = todayIso(); render(); break;
    case 'week': shift(+el.dataset.n / 7); break;
    case 'open-day': UI.day = el.dataset.d; go('denik'); break;
    case 'month': shift(+el.dataset.n); break;
    case 'q-load': FORM.j.loads = +el.dataset.v; updJobCalc(); break;
    case 'load': FORM.j.loads = Math.max(0, Math.round((FORM.j.loads + +el.dataset.n) * 4) / 4); updJobCalc(); break;
    case 'calc-km': calcKm(); break;
    case 'pick-cust': { const it = FORM.csugg[+el.dataset.i]; if (!it) break; $('#j-cust').value = it.name; FORM.j.customerIco = it.ico || ''; $('#j-cico').textContent = it.ico ? 'IČO ' + it.ico + (it.addr ? ' · sídlo ' + it.addr : '') : ''; hideCust(); break; }
    case 'pick-sugg': { const it = FORM.sugg[+el.dataset.i]; if (!it) break; $('#j-place').value = it.label; FORM.coords = { lat: it.lat, lon: it.lon }; hideSugg(); calcKm(); break; }
    case 'geo': useGeo(); break;
    case 'save-job': saveJob(); break;
    case 'del-job': if (confirm('Opravdu smazat tuto zakázku?')) { DB.jobs = DB.jobs.filter(j => j.id !== FORM.j.id); saveData(); closeSheet(); render(); toast('Smazáno'); } break;
    case 'save-fuel': saveFuel(); break;
    case 'near-fuel': nearFuel(false); break;
    case 'pick-station': { const x = FORM.stations[+el.dataset.i]; if (x) { $('#f-place').value = x.label; $('#f-st').className = 'status ok'; $('#f-st').textContent = 'Vybráno: ' + x.label; } const l = $('#f-sugg'); l.innerHTML = ''; l.classList.add('hidden'); break; }
    case 'veh': FORM.f.vehicle = el.dataset.v; document.querySelectorAll('[data-act="veh"]').forEach(b => { const on = b.dataset.v === FORM.f.vehicle; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
      { const o = ODO[FORM.f.vehicle]; $('#f-odo-box').classList.toggle('hidden', !o); if (o) { $('#f-odo-lb').textContent = o.lb; $('#f-odo').placeholder = FORM.f.vehicle === 'auto' ? 'např. 152 340' : 'např. 1 250,5'; } } updOdo(); break;
    case 'del-fuel': if (confirm('Opravdu smazat toto tankování?')) { DB.fuel = DB.fuel.filter(f => f.id !== FORM.f.id); saveData(); closeSheet(); render(); toast('Smazáno'); } break;
    case 'csv-jobs': csvJobs(); break;
    case 'stat-mode': UI.statMode = el.dataset.v; UI.statOff = 0; render(); break;
    case 'stat-nav': shift(+el.dataset.n); break;
    case 'tip': showTip(el.dataset.c, +el.dataset.i); break;
    case 'csv-fuel': csvFuel(); break;
    case 'verify-start': {
      const st = $('#s-start-st'), addr = $('#s-start').value.trim();
      st.className = 'status'; st.textContent = 'Hledám adresu…';
      geocode(addr).then(p => { DB.settings.startAddress = addr; DB.settings.startLat = p.lat; DB.settings.startLon = p.lon; saveData(); st.className = 'status ok'; st.textContent = 'Nalezeno: ' + num(p.lat, 5) + ', ' + num(p.lon, 5); })
        .catch(() => { st.className = 'status err'; st.textContent = 'Adresu se nepodařilo najít nebo chybí signál.'; });
      break;
    }
    case 'save-settings': {
      const addr = $('#s-start').value.trim(), load = parseFloat(($('#s-load').value || '').replace(',', '.'));
      if (addr !== DB.settings.startAddress) { DB.settings.startAddress = addr; DB.settings.startLat = null; DB.settings.startLon = null; }
      if (load > 0) DB.settings.loadM3 = load;
      DB.settings.mapyKey = $('#s-key').value.trim();
      saveData(); render(); toast('Nastavení uloženo'); break;
    }
    case 'backup': download(`stepkovac-zaloha-${todayIso()}.json`, JSON.stringify(DB, null, 1), 'application/json'); break;
    case 'restore': $('#import-file').click(); break;
    case 'wipe': if (confirm('Smazat všechny zakázky a tankování? Tohle nejde vrátit.') && confirm('Opravdu? Doporučuji nejdřív stáhnout zálohu.')) { DB.jobs = []; DB.fuel = []; saveData(); render(); toast('Data smazána'); } break;
  }
});
document.addEventListener('input', (e) => {
  if (!FORM) return;
  if (FORM.kind === 'job') { if (e.target.id === 'j-place') { FORM.coords = null; onPlaceInput(); } if (e.target.id === 'j-cust') onCustInput(); updJobCalc(); }
  else { updFuelCalc(e.target.id); updOdo(); }
});
document.addEventListener('change', (e) => {
  if (e.target.id === 'day-pick' && e.target.value) { UI.day = e.target.value; render(); }
});
$('#import-file').addEventListener('change', async (e) => {
  const file = e.target.files[0]; e.target.value = '';
  if (!file) return;
  try {
    const d = JSON.parse(await file.text());
    if (!Array.isArray(d.jobs) || !Array.isArray(d.fuel)) throw 0;
    if (!confirm(`Záloha obsahuje ${d.jobs.length} zakázek a ${d.fuel.length} tankování. Nahradit současná data?`)) return;
    d.settings = Object.assign({}, DEFAULT_SETTINGS, d.settings || {});
    DB = d; saveData(); render(); toast('Data obnovena');
  } catch (er) { toast('Soubor není platná záloha'); }
});

/* ===== Posun den / týden / měsíc (tlačítka i swipe) ===== */
function shift(n) {
  if (UI.tab === 'denik') UI.day = addDays(UI.day, n);
  else if (UI.tab === 'dny') UI.week = addDays(UI.week, n * 7);
  else if (UI.tab === 'prehled') { let [y, m] = UI.month.split('-').map(Number); m += n; while (m < 1) { m += 12; y--; } while (m > 12) { m -= 12; y++; } UI.month = y + '-' + pad(m); }
  else if (UI.tab === 'stat') UI.statOff += n;
  else return;
  render();
  const v = $('#view');
  v.classList.remove('inL', 'inR'); void v.offsetWidth; v.classList.add(n > 0 ? 'inL' : 'inR');
}
(function swipe() {
  let sx = null, sy = 0, st = 0;
  const v = $('#view');
  v.addEventListener('touchstart', (e) => {
    if (e.touches.length !== 1 || FORM || e.target.closest('input,textarea,select')) { sx = null; return; }
    sx = e.touches[0].clientX; sy = e.touches[0].clientY; st = Date.now();
    if (sx < 24 || sx > window.innerWidth - 24) sx = null;
  }, { passive: true });
  v.addEventListener('touchend', (e) => {
    if (sx == null) return;
    const t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    sx = null;
    // ignorovat start u levého okraje (gesto Safari "zpět")
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5 && Date.now() - st < 800) {
      e.preventDefault();
      shift(dx < 0 ? 1 : -1);
    }
  });
  v.addEventListener('animationend', () => v.classList.remove('inL', 'inR'));
})();

/* ===== Zavření okna swipem od levého okraje ===== */
(function edgeClose() {
  let g = null;
  document.addEventListener('touchstart', (e) => {
    const sh = $('.sheet');
    if (!FORM || !sh || e.touches.length !== 1) return;
    const x = e.touches[0].clientX;
    if (x > 32) return;
    g = { x, y: e.touches[0].clientY, dx: 0, lock: null, sh, ov: $('.overlay') };
    sh.style.transition = 'none';
  }, { passive: true });
  document.addEventListener('touchmove', (e) => {
    if (!g) return;
    const t = e.touches[0], dx = t.clientX - g.x, dy = t.clientY - g.y;
    if (g.lock === null && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) g.lock = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
    if (g.lock !== 'x') { if (g.lock === 'y') g = null; return; }
    e.preventDefault();
    g.dx = Math.max(0, dx);
    g.sh.style.transform = `translateX(${g.dx}px)`;
    g.ov.style.backgroundColor = `rgba(20,24,20,${0.45 * Math.max(0, 1 - g.dx / window.innerWidth)})`;
  }, { passive: false });
  document.addEventListener('touchend', () => {
    if (!g) return;
    const { sh, ov, dx } = g; g = null;
    sh.style.transition = 'transform .2s ease-out';
    if (dx > Math.min(100, window.innerWidth * 0.25)) {
      sh.style.transform = 'translateX(100%)';
      ov.style.transition = 'background-color .2s'; ov.style.backgroundColor = 'rgba(20,24,20,0)';
      setTimeout(closeSheet, 200);
    } else {
      sh.style.transform = ''; ov.style.backgroundColor = '';
    }
  });
})();

render();
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
</script>
